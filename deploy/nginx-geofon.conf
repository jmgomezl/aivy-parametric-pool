# /etc/nginx/sites-available/geofon.aivylabs
# One seismic oracle, paid per attestation over x402.
# HTTP only — certbot --nginx adds the TLS server block and the redirect.
server {
    server_name geofon.aivylabs.xyz;

    location / {
        proxy_pass http://127.0.0.1:8813;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Attestations query three public catalogues and settle a payment on
        # Hedera before answering, so the default 60s is not enough.
        proxy_read_timeout 180s;
        client_max_body_size 64k;
    }


}

server {
    if ($host = geofon.aivylabs.xyz) {
        return 301 https://$host$request_uri;


    server_name geofon.aivylabs.xyz;

    listen 80;


}